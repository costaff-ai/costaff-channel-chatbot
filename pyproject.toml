[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costaff-channel-chatbot"
version = "0.1.0"
description = "Shared runtime for CoStaff chatbot-style channels (Telegram, Discord, Slack, LINE)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "CoStaff" }]
keywords = ["costaff", "chatbot", "channel", "adk"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/costaff-ai/costaff-channel-chatbot"

[tool.setuptools.packages.find]
include = ["costaff_channel_chatbot*"]
